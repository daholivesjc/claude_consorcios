# Administradoras de Consórcio — Referência
#
# MCP Validated: 2026-05-02
# Fonte: docs/Relatório de Pesquisa...md §3 e referências [2]–[7]
#
# Flags:
#   tipo:                  independente | banco | corretora_marketplace
#   autoriza_transferencia:
#     - true            → conhecida por aceitar cessão de cotas contempladas
#     - true_com_analise → aceita mediante análise de crédito (regra padrão do mercado)
#     - intermediado    → trade existe mas é via corretor externo (caso típico de bancos)
#     - n_a             → corretoras (não administram, fazem marketplace)

version: "1.0"
last_updated: "2026-05-02"

administradoras:
  - id: ademicon
    nome: Ademicon
    tipo: independente
    autoriza_transferencia: true_com_analise
    segmentos_fortes:
      - imoveis
      - veiculos_leves
      - investimento
      - aposentadoria_imobiliaria
    observacoes: |
      Maior administradora independente do Brasil; 35 anos de atuação.
      Ecossistema explícito para compra/venda de cotas contempladas.
      Foco declarado em "Aposentadoria Imobiliária" e investimento.
    fonte_doc: "Relatório §3.1, ref [3]"

